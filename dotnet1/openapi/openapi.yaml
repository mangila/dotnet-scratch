openapi: 3.1.0
info:
  title: Item Management CRUD API
  description: A basic CRUD service designed to maximize operational utility and efficiency in managing items.
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.production.com/api/v1
    description: Production server

paths:
  /items:
    get:
      summary: List all items
      description: Retrieves a list of all existing items to maximize visibility and access to available resources.
      operationId: getItems
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return for optimal data transfer.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of items to skip for pagination efficiency.
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successfully retrieved list of items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: Create a new item
      description: Adds a new item resource to the system to enhance total utility.
      operationId: createItem
      requestBody:
        description: Item payload to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Item successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique identifier of the item.
        schema:
          type: string
          format: uuid

    get:
      summary: Get an item by ID
      description: Retrieves detailed information for a specific item.
      operationId: getItemById
      responses:
        '200':
          description: Item found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing item
      description: Updates properties of an existing item to maintain accurate state and value.
      operationId: updateItem
      requestBody:
        description: Updated item data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Item successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid input provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete an item
      description: Removes an obsolete or unnecessary item to optimize storage and reduce clutter.
      operationId: deleteItem
      responses:
        '204':
          description: Item successfully deleted. No content returned.
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Item:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique item identifier.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          description: Name of the item.
          example: "Standard Widget"
        description:
          type: string
          nullable: true
          description: Detailed explanation of item functionality and purpose.
          example: "A high-utility widget designed for general-purpose operations."
        quantity:
          type: integer
          minimum: 0
          default: 0
          description: Available quantity in stock.
          example: 100
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the item was registered.
          example: "2026-10-24T14:57:00Z"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the item was last modified.
          example: "2026-10-24T14:57:00Z"

    ItemCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the item to be created.
          example: "Standard Widget"
        description:
          type: string
          nullable: true
          description: Description of the new item.
          example: "A high-utility widget designed for general-purpose operations."
        quantity:
          type: integer
          minimum: 0
          default: 0
          description: Initial stock quantity.
          example: 100

    ItemUpdate:
      type: object
      properties:
        name:
          type: string
          description: Updated name for the item.
          example: "Upgraded Widget"
        description:
          type: string
          nullable: true
          description: Updated description for the item.
          example: "An improved widget delivering enhanced practical benefits."
        quantity:
          type: integer
          minimum: 0
          description: Updated stock quantity.
          example: 150

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error description.
          example: "The requested item could not be found."
