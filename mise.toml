monorepo_root = true

[monorepo]
config_roots = ["dotnet1"]

[tools]
node = "24.21.0"
python = "3.15.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.commit]
description = "Add all, amend commit and force push"
run = "git add . && git commit --amend -m \"chore(dotnet): add dotnet stuffs\" && git push --force-with-lease"

[tasks.megalint]
description = "Megalint with Dotnet flavor"
run = "podman run --rm -v $(pwd):/tmp/lint:rw docker.io/oxsecurity/megalinter-dotnet"